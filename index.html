<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR 魔法陣 - 5段階速度判定</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js - より安定したバージョンに変更 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <!-- UI Overlay - カメラを邪魔しないように調整 -->
    <div id="ui-overlay">
        <div id="instructions" class="instruction-text">
            <h2>魔法陣召喚体験</h2>
            <p>📱 Hiroマーカーにカメラを向けてください</p>
            <p>✋ 魔法陣が現れたら画面をタッチ！</p>
        </div>
        <div id="status" class="status-text" style="display: none;"></div>
        <div id="result" class="result-text" style="display: none;"></div>
        <button id="replay-btn" style="display: none; 
            position: fixed; 
            bottom: 100px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1001;">もう一度挑戦</button>
    </div>

    <!-- AR Scene -->
    <a-scene
        arjs
        embedded
        renderer="logarithmicDepthBuffer: true;"
        background="transparent"
        vr-mode-ui="enabled: false"
        style="width: 100vw; height: 100vh;"
        id="ar-scene">
        
        <!-- Assets -->
        <a-assets>
            <!-- 魔法陣テクスチャ - データURIで確実に読み込み -->
            <img id="magic-circle-texture" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgdmlld0JveD0iMCAwIDUxMiA1MTIiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHJhZGlhbEdyYWRpZW50IGlkPSJtYWdpY0dyYWQiIGN4PSI1MCUiIGN5PSI1MCUiIHI9IjUwJSI+PHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iI0ZGRDcwMCIgc3RvcC1vcGFjaXR5PSIwLjgiLz48c3RvcCBvZmZzZXQ9IjYwJSIgc3RvcC1jb2xvcj0iI0ZGNDU0MDAiIHN0b3Atb3BhY2l0eT0iMC42Ii8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjOEEyQkUyIiBzdG9wLW9wYWNpdHk9IjAuMiIvPjwvcmFkaWFsR3JhZGllbnQ+PC9kZWZzPjxjaXJjbGUgY3g9IjI1NiIgY3k9IjI1NiIgcj0iMjQwIiBmaWxsPSJub25lIiBzdHJva2U9IiNGRkQ3MDAiIHN0cm9rZS13aWR0aD0iNCIgb3BhY2l0eT0iMC44Ii8+PGNpcmNsZSBjeD0iMjU2IiBjeT0iMjU2IiByPSIyMjAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0ZGNDU0MDAiIHN0cm9rZS13aWR0aD0iMiIgb3BhY2l0eT0iMC42Ii8+PGNpcmNsZSBjeD0iMjU2IiBjeT0iMjU2IiByPSIxODAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzhBMkJFMiIgc3Ryb2tlLXdpZHRoPSIzIiBvcGFjaXR5PSIwLjciLz48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjE2MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRkZENzAwIiBzdHJva2Utd2lkdGg9IjIiIG9wYWNpdHk9IjAuNSIvPjxjaXJjbGUgY3g9IjI1NiIgY3k9IjI1NiIgcj0iMTIwIiBmaWxsPSJub25lIiBzdHJva2U9IiNGRjQ1NDAwIiBzdHJva2Utd2lkdGg9IjIiIG9wYWNpdHk9IjAuNiIvPjwvc3ZnPg==" crossorigin="anonymous">
            <!-- 召喚オブジェクトモデル -->
            <a-asset-item id="model-a" src="assets/models/model-a.glb"></a-asset-item>
            <a-asset-item id="model-b" src="assets/models/model-b.glb"></a-asset-item>
            <a-asset-item id="model-c" src="assets/models/model-c.glb"></a-asset-item>
            <a-asset-item id="model-d" src="assets/models/model-d.glb"></a-asset-item>
            <a-asset-item id="model-e" src="assets/models/model-e.glb"></a-asset-item>
        </a-assets>

        <!-- Camera -->
        <a-entity camera></a-entity>

        <!-- AR Marker - Hiroマーカーに変更 -->
        <a-marker preset="hiro" id="hiro-marker">
            <!-- 魔法陣（Planeオブジェクト with テクスチャ） -->
            <a-entity id="magic-circle-entity">
                <a-plane 
                    id="magic-circle-plane"
                    src="#magic-circle-texture"
                    width="2" 
                    height="2"
                    position="0 0.01 0" 
                    rotation="-90 0 0"
                    material="transparent: true; alphaTest: 0.1"
                    visible="true"
                    animation__rotate="property: rotation; to: -90 360 0; loop: true; dur: 8000; easing: linear">
                </a-plane>
            </a-entity>
            
            <!-- 召喚オブジェクト（条件に応じて表示） -->
            <a-entity id="summoned-object" position="0 0.5 0" visible="false"></a-entity>
        </a-marker>
    </a-scene>

    <!-- JavaScript -->
    <script src="js/touch-handler.js"></script>
    <script src="js/ar-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
