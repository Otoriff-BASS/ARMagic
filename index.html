<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" user-scalable=no>
    <title>AR魔法陣</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js - より安定したバージョンに変更 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- 円形マスクシェーダー -->
    <script src="js/circular-mask-shader.js"></script>
</head>
<body>
    <!-- UI Overlay - カメラを邪魔しないように調整 -->
    <div id="ui-overlay">
        <div id="instructions" class="instruction-text">
            <h2>AR魔法陣</h2>
            <p>マーカーにカメラを向けてください</p>
            <p>画面をぐるぐるかき混ぜて召喚しよう！</p>
            <p style="font-size: 14px; opacity: 0.8;">円を5回転以上描くと召喚成功！</p>
        </div>
        <div id="status" class="status-text" style="display: none;"></div>
        <div id="result" class="result-text" style="display: none;"></div>
        <button id="replay-btn" style="display: none; 
            position: fixed; 
            bottom: 100px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1001;">もう一度挑戦</button>
    </div>

    <!-- AR Scene -->
    <a-scene
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        embedded
        renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;"
        vr-mode-ui="enabled: false"
        style="width: 100vw; height: 100vh;"
        id="ar-scene"
        device-orientation-permission-ui="enabled: false">
        
        <!-- Assets -->
        <a-assets>
            <!-- 魔法陣テクスチャ - PNG画像を使用 -->
            <img id="magic-circle-texture" src="assets/textures/magic-circle-placeholder.png" crossorigin="anonymous">
            <!-- 召喚オブジェクトモデル - 実際のモデルファイルを使用 -->
            <a-asset-item id="ayu-model" src="assets/models/ayu.glb" response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="gozen-model" src="assets/models/gozen.glb" response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="okonomiyaki-model" src="assets/models/okonomiyaki.glb" response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="oyakodon-model" src="assets/models/oyakodon.glb" response-type="arraybuffer"></a-asset-item>
            <a-asset-item id="softcream-model" src="assets/models/softcream.glb" response-type="arraybuffer"></a-asset-item>
        </a-assets>

        <!-- Camera -->
        <a-entity camera></a-entity>

        <!-- AR Marker - Hiroマーカーに変更 -->
        <a-marker 
            preset="hiro" 
            id="hiro-marker"
            raycaster="objects: .clickable"
            cursor="fuse: false; rayOrigin: mouse;">
            
            <!-- 魔法陣（Planeオブジェクト - マーカーから浮かせて表示） -->
            <a-entity id="magic-circle-entity">
                <!-- メインの魔法陣Plane - 円形マスクコンポーネント使用 -->
                <a-plane 
                    id="magic-circle-plane"
                    src="#magic-circle-texture"
                    width="1.5" 
                    height="1.5"
                    position="0 0.3 0" 
                    rotation="-90 0 0"
                    material="transparent: true; opacity: 0.9; side: double"
                    circular-mask="radius: 0.48"
                    animation__rotate="property: rotation; to: -90 360 0; loop: true; dur: 8000; easing: linear"
                    animation__float="property: position; to: 0 0.5 0; dir: alternate; loop: true; dur: 4000; easing: easeInOutSine">
                </a-plane>
                
                <!-- 外側のリング（装飾） -->
                <a-ring 
                    color="#FFD700" 
                    position="0 0.35 0" 
                    radius-inner="0.9" 
                    radius-outer="1.0" 
                    rotation="-90 0 0"
                    material="transparent: true; opacity: 0.6"
                    animation__spin="property: rotation; to: -90 360 0; loop: true; dur: 12000; easing: linear">
                </a-ring>
                
                <!-- 内側のリング（装飾） - テクスチャの裏側に表示 -->
                <a-ring 
                    color="#8A2BE2" 
                    position="0 0.2 0" 
                    radius-inner="0.5" 
                    radius-outer="0.7" 
                    rotation="-90 0 0"
                    material="transparent: true; opacity: 0.7"
                    animation__counter_spin="property: rotation; to: -90 -360 0; loop: true; dur: 10000; easing: linear">
                </a-ring>
            </a-entity>
            
            <!-- 召喚オブジェクト（条件に応じて表示） -->
            <a-entity 
                id="summoned-object" 
                position="0 1 0" 
                scale="1 1 1"
                rotation="0 0 0"
                visible="false">
            </a-entity>
        </a-marker>
    </a-scene>

    <!-- JavaScript -->
    <script src="js/particle-system.js"></script>
    <script src="js/touch-handler.js"></script>
    <script src="js/ar-manager.js"></script>
    <script src="js/app.js"></script>
    
    <!-- デバッグ用インラインスクリプト -->
    <script>
        // ページ読み込み完了後にデバッグ関数を確実に設定
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded - setting up debug functions...');
            
            // 少し遅延させてARManager初期化を待つ
            setTimeout(function() {
                console.log('Setting up global debug functions (delayed)...');
                
                window.testDebugObject = function() {
                    console.log('=== DEBUG OBJECT TEST ===');
                    console.log('ARManager available:', !!window.arManager);
                    
                    if (window.arManager) {
                        console.log('Marker visible:', window.arManager.isMarkerVisible);
                        console.log('Calling showDebugObject...');
                        window.arManager.showDebugObject();
                    } else {
                        console.error('ARManager not found!');
                        console.log('Window keys:', Object.keys(window).filter(k => k.includes('ar') || k.includes('AR')));
                    }
                };
                
                window.testSummon = function(modelId = 'ayu-model') {
                    console.log('=== SUMMON TEST ===');
                    console.log('Model ID:', modelId);
                    console.log('ARManager available:', !!window.arManager);
                    
                    if (window.arManager) {
                        console.log('Marker visible:', window.arManager.isMarkerVisible);
                        window.arManager.showSummonedObject(modelId);
                    } else {
                        console.error('ARManager not found!');
                    }
                };
                
                window.checkStatus = function() {
                    console.log('=== STATUS CHECK ===');
                    console.log('ARManager:', !!window.arManager);
                    console.log('TouchHandler:', !!window.touchHandler);
                    
                    if (window.arManager) {
                        console.log('AR Status:', window.arManager.getSceneStatus());
                        
                        const obj = document.getElementById('summoned-object');
                        if (obj) {
                            console.log('Summoned Object:', {
                                exists: true,
                                position: obj.getAttribute('position'),
                                scale: obj.getAttribute('scale'),
                                visible: obj.getAttribute('visible'),
                                parent: obj.parentElement ? obj.parentElement.tagName : 'None'
                            });
                        } else {
                            console.log('Summoned object not found');
                        }
                    }
                };
                
                window.testFallback = function(modelId = 'ayu-model') {
                    console.log('=== FALLBACK TEST ===');
                    if (window.arManager) {
                        console.log('Testing fallback for:', modelId);
                        window.arManager.showModelFallback(modelId);
                    } else {
                        console.error('ARManager not found!');
                    }
                };
                
                window.testMagicCircle = function() {
                    console.log('=== MAGIC CIRCLE TEST ===');
                    if (window.arManager) {
                        console.log('Showing magic circle...');
                        window.arManager.showMagicCircle();
                        
                        // 追加の詳細チェック
                        setTimeout(() => {
                            const entity = document.getElementById('magic-circle-entity');
                            const plane = document.getElementById('magic-circle-plane');
                            
                            console.log('Magic circle detailed check:', {
                                entityVisible: entity ? entity.getAttribute('visible') : 'Entity not found',
                                planeExists: !!plane,
                                planeVisible: plane ? plane.getAttribute('visible') : 'Plane not found',
                                planePosition: plane ? plane.getAttribute('position') : 'N/A',
                                textureLoaded: plane ? !!plane.getAttribute('src') : 'N/A'
                            });
                        }, 500);
                    } else {
                        console.error('ARManager not found!');
                    }
                };
                
                window.toggleMagicCircle = function() {
                    console.log('=== TOGGLE MAGIC CIRCLE ===');
                    const entity = document.getElementById('magic-circle-entity');
                    if (entity) {
                        const isVisible = entity.getAttribute('visible') === 'true';
                        entity.setAttribute('visible', !isVisible);
                        console.log(`Magic circle ${!isVisible ? 'shown' : 'hidden'}`);
                    } else {
                        console.error('Magic circle entity not found!');
                    }
                };
                
                window.testNaNDebug = function() {
                    console.log('=== NaN DEBUG TEST ===');
                    if (window.touchHandler && window.touchHandler.touchPath.length > 0) {
                        console.log('Current path length:', window.touchHandler.touchPath.length);
                        console.log('Sample points:', window.touchHandler.touchPath.slice(0, 10));
                        
                        // 各点の妥当性をチェック
                        const invalidPoints = window.touchHandler.touchPath.filter((point, index) => {
                            const isInvalid = !point || 
                                typeof point.x !== 'number' || 
                                typeof point.y !== 'number' || 
                                isNaN(point.x) || 
                                isNaN(point.y) ||
                                !isFinite(point.x) || 
                                !isFinite(point.y);
                            if (isInvalid) {
                                console.log(`Invalid point at index ${index}:`, point);
                            }
                            return isInvalid;
                        });
                        
                        console.log('Invalid points found:', invalidPoints.length);
                        
                        // 中心点計算テスト
                        try {
                            const center = window.touchHandler.calculateCenter();
                            console.log('Center calculation result:', center);
                        } catch (error) {
                            console.error('Center calculation error:', error);
                        }
                        
                        // 回転数計算テスト
                        try {
                            const revolutions = window.touchHandler.calculateRevolutions();
                            console.log('Revolution calculation result:', revolutions);
                        } catch (error) {
                            console.error('Revolution calculation error:', error);
                        }
                        
                        // 詳細デバッグ
                        try {
                            window.touchHandler.debugCircleAnalysis();
                        } catch (error) {
                            console.error('Debug circle analysis error:', error);
                        }
                        
                    } else {
                        console.log('No touch path data available. Draw something first!');
                    }
                };
                
                window.testScoreDebug = function() {
                    console.log('=== SCORE DEBUG TEST ===');
                    if (window.touchHandler && window.touchHandler.touchPath.length > 0) {
                        console.log('Current path length:', window.touchHandler.touchPath.length);
                        
                        // スコア計算テスト
                        try {
                            const scoreResult = window.touchHandler.calculateTotalScore();
                            console.log('Score calculation result:', scoreResult);
                            
                            // 詳細スコアデバッグ
                            window.touchHandler.debugScore();
                            
                        } catch (error) {
                            console.error('Score calculation error:', error);
                        }
                        
                    } else {
                        console.log('No touch path data available. Draw something first!');
                    }
                };
                
                console.log('Debug functions ready:', {
                    testDebugObject: typeof window.testDebugObject,
                    testSummon: typeof window.testSummon,
                    checkStatus: typeof window.checkStatus,
                    testFallback: typeof window.testFallback,
                    testMagicCircle: typeof window.testMagicCircle,
                    toggleMagicCircle: typeof window.toggleMagicCircle,
                    testNaNDebug: typeof window.testNaNDebug,
                    testScoreDebug: typeof window.testScoreDebug
                });
                
            }, 1000); // 1秒待ってから設定
        });
    </script>
</body>
</html>
